<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#090b12" />
  <title>Anime Draft — Prototype V0.15</title>
  <link rel="preload" as="image" href="assets/home/home-center.webp" fetchpriority="high">
  <link rel="preload" as="image" href="assets/home/home-left.webp">
  <link rel="preload" as="image" href="assets/home/home-right.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="noise"></div>
  <div class="aurora aurora-a"></div>
  <div class="aurora aurora-b"></div>
  <main id="app"></main>
  <div id="toast" class="toast" aria-live="polite"></div>
  <script>
    // Il server Socket.IO viene avviato solo nell'ambiente Node locale.
    // Su Vercel la pagina continua a funzionare senza tentare una richiesta
    // che verrebbe risolta dall'HTML della home.
    if (!window.location.hostname.endsWith('.vercel.app')) {
      document.write('<script src="/socket.io/socket.io.js"><\/script>');
    }
  </script>
  <script src="app.js"></script>
</body>
</html>
